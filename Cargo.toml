[package]
name = "telaio"
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
description = "A minimal Matrix client for the terminal"
license = "GPL-3.0-or-later"
repository = "https://github.com/Levvonci/Telaio"
readme = "README.md"
keywords = ["matrix", "chat", "tui", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "telaio"
path = "src/main.rs"

[dependencies]
matrix-sdk = { version = "0.19", features = ["bundled-sqlite", "markdown"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = "0.4"
toml = "=1.1.6"
mime_guess = "2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
